name: Sync Podio to Geckoboard

on:
  schedule:
    # Kører hvert 15. minut. Med ~3.300 Podio-items tager en fuld
    # synkronisering ca. 3-3,5 minutter, så hvert 5. minut (som vi startede
    # med) ville stort set fylde hele intervallet og risikere overlap.
    # Sign-on/go-live-datoer ændrer sig sjældent i løbet af en dag, så 15
    # minutter er stadig praktisk talt live til formålet.
    # Bemærk: GitHub kan forsinke schedulerede kørsler et par minutter ved
    # høj belastning på deres side — det er normalt og ikke til at styre.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # gør det muligt manuelt at trigge en kørsel fra GitHub UI

concurrency:
  # Undgår at to kørsler af sync'et overlapper (fx hvis en kørsel en dag
  # skulle tage længere end normalt) — en ny kørsel venter i stedet for at
  # skrive til Geckoboard samtidig med en kørsel der stadig er i gang.
  group: podio-geckoboard-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          PODIO_CLIENT_ID: ${{ secrets.PODIO_CLIENT_ID }}
          PODIO_CLIENT_SECRET: ${{ secrets.PODIO_CLIENT_SECRET }}
          PODIO_APP_ID: ${{ secrets.PODIO_APP_ID }}
          PODIO_APP_TOKEN: ${{ secrets.PODIO_APP_TOKEN }}
          GECKOBOARD_API_KEY: ${{ secrets.GECKOBOARD_API_KEY }}
          GECKOBOARD_DATASET_NAME: ${{ secrets.GECKOBOARD_DATASET_NAME }}
        run: python sync.py
